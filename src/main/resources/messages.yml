# Include %prefix% only on messages where you want it. Set a message to "" or [] to hide it.
# Colors: &a, &#RRGGBB, or &x&R&R&G&G&B&B. Messages may be strings or lists of strings.
prefix: "&d&lPlexVariables &8» "

messages:
  no-permission: "%prefix%&cYou do not have permission."
  unknown-command: "%prefix%&cUnknown command. Use /%label% help."
  help:
    - "&d&lVariable commands"
    - "&f/%label% help &8- &7Show this help"
    - "&f/%label% reload &8- &7Reload settings, messages, and variables"
    - "&f/%label% list [page] &8- &7List variables and their source files"
    - "&f/%label% parse <player|--null> <text> &8- &7Parse placeholders"
    - "&f/%label% test <player|--null> <variable> &8- &7Test variable evaluation trace"
    - "&f/%label% set <variable> <player|global> <value> &8- &7Set a stored variable"
    - "&f/%label% add <variable> <player|global> <amount> &8- &7Add to a stored variable"
    - "&f/%label% get <variable> [player|global] &8- &7Get a stored variable"
    - "&f/%label% reset <variable> <player|global> &8- &7Reset a stored variable to default"
  reloading: "%prefix%&7Loading configuration and variables..."
  reload-in-progress: "%prefix%&eA reload is already in progress."
  reload-success: "%prefix%&aReloaded &f%variables% &avariables in &f%time%ms&a."
  reload-failed: "%prefix%&cReload failed; the previous configuration is still active. Check the console."
  variable-not-found: "%prefix%&cVariable not found: %variable%."
  player-not-found: "%prefix%&cPlayer %player% is not online or cached. Use an online player or --null."
  parse-usage: "%prefix%&cUsage: /%label% parse <player|--null> <placeholder or text>"
  parse-failed: "%prefix%&cParsing failed. Check the console for details."
  parse-input: "&7Placeholder: &f%placeholder%"
  parse-result: "&7Result: &f%result%"
  parse-time: "&7Parse Time: &f%time%ms"
  test-usage: "%prefix%&cUsage: /%label% test <player|--null> <variable>"
  test-failed: "%prefix%&cTest evaluation failed. Check the console for details."
  test-header: "&d&lVariable Test &8» &f%variable% &8[&7%type%&8] &7(%source%)"
  test-condition-title: "&7Condition #%index%:"
  test-condition-raw: "  &7Condition: &f%condition%"
  test-condition-resolved: "  &7Resolved:  &f%left% &7%operator% &f%right%"
  test-condition-native: "  &7Resolved:  &f%expression%"
  test-condition-result: "  &7Result:    %result%"
  test-selected-branch: "&7Selected: &f%branch%"
  test-expression-raw: "  &7Expression: &f%expression%"
  test-expression-resolved: "  &7Resolved:   &f%resolved%"
  test-expression-calculated: "  &7Calculated: &f%calculated%"
  test-expression-error: "  &7Error:      &c%error%"
  test-expression-formatting: "  &7Formatting: &f%formatting%"
  test-stored-scope: "  &7Scope:      &f%scope%"
  test-stored-cache-state: "  &7Cache State: &f%state%"
  test-stored-raw: "  &7Raw Stored: &f%raw%"
  test-stored-default: "  &7Default:    &f%default%"
  test-stored-effective: "  &7Effective:  &f%effective%"
  test-result: "&7Result: &f%result%"
  test-time: "&7Test Time: &f%time%ms"
  invalid-page: "%prefix%&cChoose a page between 1 and %pages%."
  list-empty: "%prefix%&7No variables are loaded."
  list-header: "&d&lVariables &8(&f%variables%&8) &7Page %page%/%pages%"
  list-entry: "&f%variable% &8[&7%type%&8] - &7%source%"
  list-footer: "&7Use /%label% list <page> to view another page."
  stored-usage-set: "%prefix%&cUsage: /%label% set <variable> <player|global> <value>"
  stored-usage-add: "%prefix%&cUsage: /%label% add <variable> <player|global> <amount>"
  stored-usage-get: "%prefix%&cUsage: /%label% get <variable> [player|global]"
  stored-usage-reset: "%prefix%&cUsage: /%label% reset <variable> <player|global>"
  stored-not-stored: "%prefix%&cVariable '%variable%' is not a stored variable."
  stored-scope-mismatch-global: "%prefix%&cVariable '%variable%' has global scope."
  stored-scope-mismatch-player: "%prefix%&cVariable '%variable%' has player scope."
  stored-set-success: "%prefix%&aSet stored variable &f%variable% &afor &f%target% &ato '&f%value%&a'."
  stored-add-success: "%prefix%&aAdded &f%amount% &ato stored variable &f%variable% &afor &f%target% &a(new value: '&f%value%&a')."
  stored-get-result: "%prefix%&7Stored variable &f%variable% &7for &f%target%&7: '&f%value%&7' (default: '&7%default%&7')."
  stored-reset-success: "%prefix%&aReset stored variable &f%variable% &afor &f%target% &a(reverted to default)."
  stored-non-numeric: "%prefix%&cStored value or added amount is not a valid number."
  stored-error: "%prefix%&cStorage operation failed: %error%"
