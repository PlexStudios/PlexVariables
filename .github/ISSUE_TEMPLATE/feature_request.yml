name: Feature request
description: Suggest an improvement for PlexVariables
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case before proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain how you would like PlexVariables to handle the use case.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: Optional YAML, placeholder, or workflow example.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or alternative designs you considered.
